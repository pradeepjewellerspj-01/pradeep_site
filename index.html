    <script>
      // The showroom TV (/screen) and the admin panel (/admin) install as their own apps.
      // Each gets its manifest before the page renders; the website itself is not an app.
      (function () {
        var p = location.pathname;
        var app = p.indexOf('/screen') === 0 ? 'screen' : p.indexOf('/admin') === 0 ? 'admin' : null;
        if (!app) return;
        var link = document.createElement('link');
        link.rel = 'manifest';
        link.href = '/' + app + '.webmanifest';
        document.head.appendChild(link);
        if (app === 'screen') document.querySelector('meta[name="theme-color"]').content = '#0b0807';
        var capable = document.createElement('meta');
        capable.name = 'mobile-web-app-capable';
        capable.content = 'yes';
        document.head.appendChild(capable);
      })();
    </script>
